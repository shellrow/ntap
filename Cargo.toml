[package]
name = "ntap"
version = "0.7.0"
edition = "2021"
authors = ["shellrow <shellrow@foctal.com>"]
description = "Network traffic monitor/analyzer"
repository = "https://github.com/shellrow/ntap"
homepage = "https://github.com/shellrow/ntap"
documentation = "https://github.com/shellrow/ntap"
readme = "README.md"
keywords = ["network","security","cross-platform"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
anyhow = { version = "1" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rangemap = "1.5"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
netdev = { version = "0.36", features = ["serde"] }
nex = { version = "0.22", features = ["serde"] }
tokio = { version = "1.38" }
clap = { version = "4.5", features = ["cargo"] }
crossterm = "0.27"
rand = "0.8"
ratatui = "0.25"
comfy-table = "7.1"
hickory-resolver = { version = "0.24" }
futures = {version = "0.3"}
netsock = { version = "0.3", features = ["serde"] }
reqwest = { version="0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["local-offset"] }
ipnet = { version = "2.11" }
home = "0.5"
termtree = "0.5"
indicatif = { version = "0.18" }
inquire = "0.6"
ndb-oui = { version = "0.1.0", default-features = false }
ndb-tcp-service = { version = "0.1.0", default-features = false }
ndb-udp-service = { version = "0.1.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.50"

[features]
default = ["bundled"]
bundled = [
    "ndb-oui/bundled",
    "ndb-tcp-service/bundled",
    "ndb-udp-service/bundled",
]

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
